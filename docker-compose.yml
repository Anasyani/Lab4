services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lab4_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    container_name: lab4_php
    volumes:
      - ./www:/var/www/html
    expose:
      - "9000"

  # Инструмент для Composer: docker compose run --rm composer install
  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./www:/app
    profiles: ["tools"]
    entrypoint: ["composer"]
